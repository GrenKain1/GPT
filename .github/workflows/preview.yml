name: Deploy FantasyDream design preview

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the compiled preview
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload only static preview files
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
